# Path -> area label mapping for .github/workflows/pr-labels.yml
#
# The first three areas mirror the contexts in CONTEXT-MAP.md, so pull
# requests and the domain docs stay in the same vocabulary. `db`, `storage`
# and `config` roll into `area:server` because docs/agents/domain.md treats
# them as the hosting context's supporting packages.
#
# A pull request can carry several area labels; that is intended.

"area:server":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/server/**"
          - "packages/db/**"
          - "packages/storage/**"
          - "packages/config/**"
          # Terraform that deploys the hosting context.
          - "infra/**"

"area:cli":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/cli/**"
          # Single-sourced into packages/cli and shipped with it.
          - "skills/**"

"area:core":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/core/**"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          # Root-level workspace and tooling config. These patterns have no
          # slash, so they match only at the root -- packages/*/package.json
          # and packages/*/tsconfig.json belong to their own package's area.
          - "turbo.json"
          - "pnpm-workspace.yaml"
          - "pnpm-lock.yaml"
          - "package.json"
          - "tsconfig*.json"
          - "*.config.js"
          - "skills-lock.json"
          - ".dockerignore"
          - ".env.example"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          # Sample artifacts that demonstrate published output.
          - "examples/**"
