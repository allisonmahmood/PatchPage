name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported Node (engines >=22; pnpm 11 also
        # requires >=22.13). cli-smoke additionally runs the packed artifact
        # on Node 22 the way end users install it.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-workflow
      - run: pnpm lint
      - run: pnpm typecheck

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter patchpage build
      - name: Pack tarball and verify contents
        shell: bash
        run: |
          set -euo pipefail

          cd packages/cli
          npm pack --json > "$RUNNER_TEMP/patchpage-pack.json"

          node - "$RUNNER_TEMP/patchpage-pack.json" <<'NODE'
          const fs = require("node:fs");

          const pack = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          const required = ["dist/index.js", "skills/patchpage/SKILL.md", "LICENSE", "README.md"];
          const files = new Set(pack.files.map((file) => file.path));
          const missing = required.filter((file) => !files.has(file));

          if (missing.length > 0) {
            console.error(`Missing files from npm pack: ${missing.join(", ")}`);
            console.error("Packed files:");
            for (const file of [...files].sort()) {
              console.error(`- ${file}`);
            }
            process.exit(1);
          }
          NODE

          tarball="$(
            node - "$RUNNER_TEMP/patchpage-pack.json" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const pack = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          console.log(path.resolve(process.cwd(), pack.filename));
          NODE
          )"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "CLI_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      # The published CLI claims engines.node >=22. Verify the packed artifact
      # on the minimum supported Node the way end users get it: a clean
      # npm install of the tarball, no pnpm or repo tooling involved.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and run tarball on minimum supported Node
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"
          npm install "$TARBALL"

          output="$(./node_modules/.bin/patchpage --version)"
          if [[ "$output" != "$CLI_VERSION" ]]; then
            echo "::error::Expected patchpage --version to print $CLI_VERSION, got $output"
            exit 1
          fi

          if [[ "$output" == "0.0.0-dev" ]]; then
            echo "::error::Installed patchpage binary reported 0.0.0-dev"
            exit 1
          fi

          ./node_modules/.bin/patchpage validate "$GITHUB_WORKSPACE/examples/plan.html"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify server image
        shell: bash
        env:
          VERSION: 0.0.0-ci
          REVISION: 0000000000000000000000000000000000000000
        run: |
          set -euo pipefail

          image="patchpage-server:ci"
          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            -f apps/server/Dockerfile \
            -t "$image" .

          scripts/verify-server-image.sh "$image" "$VERSION" "$REVISION"

  azure-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Verify Azure guide command contracts
        run: |
          sh -n infra/azure/tests/guide_commands_test.sh
          sh infra/azure/tests/guide_commands_test.sh
      - name: Verify Azure Terraform
        working-directory: infra/azure
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly -no-color
          terraform validate -no-color
          terraform test -no-color

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
