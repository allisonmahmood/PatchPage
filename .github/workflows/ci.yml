name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchpage
          POSTGRES_PASSWORD: patchpage
          POSTGRES_DB: patchpage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchpage -d patchpage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PATCHPAGE_TEST_DATABASE_URL: postgresql://patchpage:patchpage@127.0.0.1:5432/patchpage_test
      PATCHPAGE_REQUIRE_POSTGRES_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported Node (engines >=22; pnpm 11 also
        # requires >=22.13). cli-smoke runs the packed real-server contract
        # entirely on Node 22 the way end users install it.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Prove the shared database contract runs against PostgreSQL
        run: pnpm --filter @patchpage/db exec vitest run src/upload-contract.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:public-surfaces
      - run: pnpm test:release-workflow
      - run: pnpm test:release-privacy
      - run: pnpm test:exact-npm-publisher
      - run: pnpm test:ghcr-oci
      - run: pnpm test:docker-save
      - run: pnpm lint
      - run: pnpm typecheck

  cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise packed CLI harness lifecycle probes
        run: |
          node scripts/packed-cli-e2e.mjs --platform-probes
          node scripts/packed-cli-e2e.mjs --lifecycle-probes
          node scripts/packed-cli-e2e.mjs --signal-probes
      - name: Exercise the packed CLI against an isolated real server
        env:
          PATCHPAGE_API_TOKEN: ambient-invalid-token
          PATCHPAGE_API_URL: http://127.0.0.1:9/ambient-poison
          PATCHPAGE_MAX_HTML_BYTES: "1"
          PATCHPAGE_UNKNOWN_AMBIENT_POISON: must-not-leak
        run: pnpm test:packed-cli-e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify server image
        shell: bash
        env:
          VERSION: 0.0.0-ci
          REVISION: "0000000000000000000000000000000000000000"
        run: |
          set -euo pipefail

          image="patchpage-server:ci"
          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            -f apps/server/Dockerfile \
            -t "$image" .

          artifact_dir="$RUNNER_TEMP/server-image-artifact"
          filename="patchpage-server-${VERSION}.tar"
          mkdir -p "$artifact_dir"
          docker save "$image" --output "$artifact_dir/$filename"
          tar_sha256="$(sha256sum "$artifact_dir/$filename" | awk '{print $1}')"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          node scripts/validate-docker-save-artifact.mjs \
            --artifact-dir "$artifact_dir" \
            --expected-filename "$filename" \
            --expected-sha256 "$tar_sha256" \
            --expected-repo-tag "$image" \
            --expected-config-id "$image_id"

          scripts/verify-server-image.sh "$image" "$VERSION" "$REVISION"

  azure-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
      - name: Verify Azure guide command contracts
        run: |
          sh -n infra/azure/tests/guide_commands_test.sh
          sh infra/azure/tests/guide_commands_test.sh
      - name: Verify Azure OpenTofu
        working-directory: infra/azure
        shell: bash
        run: |
          set -euo pipefail

          tofu fmt -check -recursive
          tofu init -backend=false -input=false -lockfile=readonly -no-color
          tofu validate -no-color
          tofu test -no-color

  # The same shell suite on the other /bin/sh and the other userland. Everything
  # under infra/azure is POSIX sh and is written to run under whatever the
  # operator's /bin/sh happens to be; on ubuntu-latest that is dash, and on
  # macos-latest it is bash 3.2, which is also what a macOS operator gets. Until
  # now that constraint was enforced by convention and by whoever remembered to
  # run the suite locally.
  #
  # A separate job rather than a matrix leg on azure-infra, deliberately:
  #
  #   * The OpenTofu half has nothing platform-specific to say. The .tf files are
  #     provider configuration and `tofu test` runs against mocks, so a second
  #     platform re-proves the same 95 runs against the same static binary --
  #     for 10x the billed minutes, which is what a macOS runner costs.
  #   * The harness half is the whole point, and it needs no OpenTofu at all: it
  #     shims tofu, terraform, az, dig, curl, git, jq, mktemp, chmod, sleep, cat
  #     and rm in infra/azure/tests/mocks and puts that directory first on PATH.
  #     Installing the real binary here would only create the chance of one being
  #     reached. Verified locally by running the suite green with no tofu on PATH.
  #
  # Two tools are the runner's own rather than shimmed. There is no openssl shim
  # at all -- the digest helpers in infra/azure/lib run the real one -- and the
  # jq shim delegates everything it does not special-case to the real jq. Both
  # binaries ship in the macOS runner image, and macOS's LibreSSL accepts the
  # `openssl dgst -sha256 -r` form those helpers use (checked against LibreSSL
  # 3.3.6, which is what /usr/bin/openssl is on macOS).
  #
  # So this job is checkout plus the suite, and nothing else.
  #
  # No accommodation is made for the trap-listing assertion in `deployed smoke`,
  # which used to be described as a macOS-only failure. It is not the platform:
  # the runbook installs a HUP trap, and POSIX permits a shell to refuse to trap
  # a signal that was already SIG_IGN when it started, so the assertion fails in
  # any process that inherited SIGHUP as SIG_IGN -- under `nohup`, or
  # backgrounded from a non-interactive shell.
  #
  # Reproduced on macOS /bin/sh, which is bash 3.2, under both `nohup` and an
  # explicit `trap '' HUP`, and green there in the foreground. dash is the
  # counter-example and the reason the claim is scoped: it registers the HUP
  # trap and reports it from `trap` even when it inherited SIG_IGN, so the
  # assertion passes there either way. So this is a property of the shell's
  # handling of inherited SIG_IGN, not of macOS, and bash 3.2 is where it bites.
  #
  # A `run:` step is a foreground process, so this leg exercises the trap
  # assertion for real rather than skipping it. If it ever goes red here, the
  # cause is the runner's process setup, not the platform -- do not paper over
  # it with a skip.
  azure-shell-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Azure guide command contracts on bash 3.2 /bin/sh
        run: |
          /bin/sh --version | head -n 1
          sh -n infra/azure/tests/guide_commands_test.sh
          sh infra/azure/tests/guide_commands_test.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
