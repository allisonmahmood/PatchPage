          const { gunzipSync } = require("node:zlib");
          writeFileSync(process.argv[3], gunzipSync(Buffer.from(readFileSync(process.argv[2], "utf8").replace(/\s+/g, ""), "base64")));
          NODE
          node - "$RUNNER_TEMP/ghcr-reconcile-latest.mjs.gz.b64" "$tools_dir/ghcr-oci-release.mjs" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const { gunzipSync } = require("node:zlib");
          writeFileSync(process.argv[3], gunzipSync(Buffer.from(readFileSync(process.argv[2], "utf8").replace(/\s+/g, ""), "base64")));
          NODE
          [[ "$(sha256sum "$tools_dir/validate-docker-save-artifact.mjs" | awk '{print $1}')" == "$validator_sha256" ]] || { echo "::error::Embedded docker-save validator source hash mismatch"; exit 1; }
          [[ "$(sha256sum "$tools_dir/ghcr-oci-release.mjs" | awk '{print $1}')" == "$oci_tool_sha256" ]] || { echo "::error::Embedded OCI release tool source hash mismatch"; exit 1; }
          chmod 500 "$tools_dir/validate-docker-save-artifact.mjs" "$tools_dir/ghcr-oci-release.mjs"
          echo "GHCR_OCI_RELEASE=$tools_dir/ghcr-oci-release.mjs" >> "$GITHUB_ENV"
      - name: Reconcile latest from complete supported GHCR releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$GHCR_OCI_RELEASE" reconcile-latest \
            --registry-url https://ghcr.io \
            --name allisonmahmood/patchpage-server

  bind-publish-results:
    if: >-
      always() &&
      needs.inspect.result == 'success' &&
      (needs.publish-ghcr.result == 'success' ||
      (needs.publish-ghcr.result == 'skipped' && needs.inspect.outputs.count == '0'))
    needs: [inspect, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      matrix: ${{ steps.bind.outputs.matrix }}
    steps:
      - name: Bind every complete supported release to an immutable result
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_COUNT: ${{ needs.inspect.outputs.count }}
          REPAIR_MATRIX: ${{ needs.inspect.outputs.matrix }}
          RELEASE_SNAPSHOT: ${{ needs.inspect.outputs.snapshot }}
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/reconcile-publish-result-artifacts.tsv"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .expired, .created_at] | @tsv' > "$artifacts"
          matrix="$(
            node - "$RELEASE_SNAPSHOT" "$REPAIR_MATRIX" "$REPAIR_COUNT" "$artifacts" <<'NODE'
          const fs = require("node:fs");
          const [rawSnapshot, rawRepairMatrix, rawRepairCount, artifactPath] = process.argv.slice(2);
          const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const revision = /^[0-9a-f]{40}$/;
          const digest = /^sha256:[0-9a-f]{64}$/;
          const identityKeys = ["tag", "version", "revision"];

          const validateIdentity = (row, label) => {
            if (row.tag !== `v${row.version}` || !stable.test(row.version) || !revision.test(row.revision)) {
              throw new Error(`${label} identity is invalid`);
            }
          };

          const snapshot = JSON.parse(rawSnapshot);
          if (!Array.isArray(snapshot)) throw new Error("release snapshot is invalid");
          const snapshotByTag = new Map();
          for (const row of snapshot) {
            const expectedKeys =
              row.status === "complete"
                ? [...identityKeys, "status", "manifestDigest", "configDigest"]
                : [...identityKeys, "status"];
            if (JSON.stringify(Object.keys(row)) !== JSON.stringify(expectedKeys)) {
              throw new Error(`release snapshot row keys are invalid for ${row.tag ?? "unknown"}`);
            }
            validateIdentity(row, "release snapshot row");
            if (!["complete", "missing", "incomplete"].includes(row.status)) {
              throw new Error(`release snapshot status is invalid for ${row.tag}`);
            }
            if (
              row.status === "complete" &&
              (!digest.test(row.manifestDigest) || !digest.test(row.configDigest))
            ) {
              throw new Error(`release snapshot digests are invalid for ${row.tag}`);
            }
            if (snapshotByTag.has(row.tag)) throw new Error(`duplicate release snapshot row ${row.tag}`);
            snapshotByTag.set(row.tag, row);
          }

          const repairMatrix = JSON.parse(rawRepairMatrix);
          if (
            JSON.stringify(Object.keys(repairMatrix)) !== JSON.stringify(["include"]) ||
            !Array.isArray(repairMatrix.include)
          ) {
            throw new Error("repair matrix is invalid");
          }
          if (!/^(0|[1-9][0-9]*)$/.test(rawRepairCount) || Number(rawRepairCount) !== repairMatrix.include.length) {
            throw new Error("repair matrix count is invalid");
          }
          const repairByTag = new Map();
          for (const row of repairMatrix.include) {
            if (JSON.stringify(Object.keys(row)) !== JSON.stringify(identityKeys)) {
              throw new Error("repair matrix row keys are invalid");
            }
            validateIdentity(row, "repair matrix row");
            const snapshotRow = snapshotByTag.get(row.tag);
            if (
              !snapshotRow ||
              snapshotRow.version !== row.version ||
              snapshotRow.revision !== row.revision ||
              !["missing", "incomplete"].includes(snapshotRow.status)
            ) {
              throw new Error(`repair matrix row ${row.tag} is not a repairable snapshot row`);
            }
            if (repairByTag.has(row.tag)) throw new Error(`duplicate repair matrix row ${row.tag}`);
            repairByTag.set(row.tag, row);
          }

          const artifacts = fs
            .readFileSync(artifactPath, "utf8")
            .trim()
            .split(/\n+/)
            .filter(Boolean)
            .map((line) => {
              const [id, name, expired, createdAt, ...extra] = line.split("\t");
              const created = Date.parse(createdAt);
              if (
                extra.length !== 0 ||
                !/^[1-9][0-9]*$/.test(id) ||
                !name ||
                !/^(true|false)$/.test(expired) ||
                !Number.isFinite(created)
              ) {
                throw new Error("publication result artifact listing is invalid");
              }
              return { id, name, expired: expired === "true", created };
            });

          const include = [];
          for (const row of snapshot) {
            if (row.status === "complete") {
              include.push({
                tag: row.tag,
                version: row.version,
                revision: row.revision,
                source: "snapshot",
                artifactId: "",
                manifestDigest: row.manifestDigest,
                configDigest: row.configDigest,
              });
              continue;
            }
            if (!repairByTag.has(row.tag)) continue;
            const name = `reconcile-publish-result-${row.version}-${row.revision}.json`;
            const matches = artifacts
              .filter((artifact) => artifact.name === name && !artifact.expired)
              .sort((left, right) =>
                right.created !== left.created
                  ? right.created - left.created
                  : BigInt(right.id) > BigInt(left.id)
                    ? 1
                    : BigInt(right.id) < BigInt(left.id)
                      ? -1
                      : 0,
              );
            if (matches.length === 0) {
              throw new Error(`no live publication result artifact named ${name}`);
            }
            include.push({
              tag: row.tag,
              version: row.version,
              revision: row.revision,
              source: "artifact",
              artifactId: matches[0].id,
              manifestDigest: "",
              configDigest: "",
            });
          }
          process.stdout.write(JSON.stringify({ include }));
          NODE
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  ghcr-anonymous-acceptance:
    if: >-
      needs.reconcile-latest.result == 'success' &&
      needs.bind-publish-results.result == 'success'
    needs:
      - bind-publish-results
      - reconcile-latest
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.bind-publish-results.outputs.matrix) }}
    steps:
      - name: Download exact immutable publication result
        if: matrix.source == 'artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.artifactId }}
          path: ${{ runner.temp }}/publication-result
          skip-decompress: true
      - name: Resolve the exact snapshot or publication result binding
        id: bound-result
        shell: bash
        env:
          ARTIFACT_ID: ${{ matrix.artifactId }}
          REVISION: ${{ matrix.revision }}
          SNAPSHOT_CONFIG_DIGEST: ${{ matrix.configDigest }}
          SNAPSHOT_MANIFEST_DIGEST: ${{ matrix.manifestDigest }}
          SOURCE: ${{ matrix.source }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/publication-result" "$TAG" "$VERSION" "$REVISION" "$SOURCE" "$ARTIFACT_ID" "$SNAPSHOT_MANIFEST_DIGEST" "$SNAPSHOT_CONFIG_DIGEST" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [directory, tag, version, revision, source, artifactId, snapshotManifest, snapshotConfig, outputPath] = process.argv.slice(2);
          const digest = /^sha256:[0-9a-f]{64}$/;
          if (tag !== `v${version}` || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version) || !/^[0-9a-f]{40}$/.test(revision)) {
            throw new Error("acceptance matrix identity is invalid");
          }
          let manifestDigest;
          let configDigest;
          if (source === "snapshot") {
            if (artifactId !== "" || !digest.test(snapshotManifest) || !digest.test(snapshotConfig)) {
              throw new Error("snapshot acceptance binding is invalid");
            }
            if (fs.existsSync(directory)) {
              throw new Error("snapshot acceptance must not consume a publication artifact");
            }
            manifestDigest = snapshotManifest;
            configDigest = snapshotConfig;
          } else if (source === "artifact") {
            if (!/^[1-9][0-9]*$/.test(artifactId) || snapshotManifest !== "" || snapshotConfig !== "") {
              throw new Error("artifact acceptance binding is invalid");
            }
            const expectedName = `reconcile-publish-result-${version}-${revision}.json`;
            const entries = fs.readdirSync(directory);
            if (entries.length !== 1 || entries[0] !== expectedName) throw new Error("publication result directory must contain exactly the expected file");
            const resultPath = path.join(directory, expectedName);
            const resultStat = fs.lstatSync(resultPath);
            if (!resultStat.isFile() || resultStat.isSymbolicLink() || resultStat.nlink !== 1) throw new Error("publication result must be a regular non-link file");
            const raw = fs.readFileSync(resultPath, "utf8");
            const value = JSON.parse(raw);
            const keys = ["version", "revision", "manifestDigest", "configDigest"];
            if (JSON.stringify(Object.keys(value)) !== JSON.stringify(keys)) throw new Error("publication result keys are invalid");
            if (raw !== `${JSON.stringify(value)}\n`) throw new Error("publication result JSON must be canonical");
            if (value.version !== version || value.revision !== revision) throw new Error("publication result identity does not match the matrix");
            if (!digest.test(value.manifestDigest) || !digest.test(value.configDigest)) throw new Error("publication result digests are invalid");
            manifestDigest = value.manifestDigest;
            configDigest = value.configDigest;
          } else {
            throw new Error("acceptance matrix source is invalid");
          }
          fs.appendFileSync(outputPath, `manifest-digest=${manifestDigest}\nconfig-digest=${configDigest}\n`);
          NODE
      - name: Pull both bound release tags anonymously, then boot the exact digest
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          REVISION: ${{ matrix.revision }}
          EXPECTED_MANIFEST_DIGEST: ${{ steps.bound-result.outputs.manifest-digest }}
          EXPECTED_CONFIG_DIGEST: ${{ steps.bound-result.outputs.config-digest }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" || -n "${DOCKER_AUTH_CONFIG:-}" ]]; then
            echo "::error::Anonymous acceptance received registry credentials"
            exit 1
          fi
          if [[ ! "$EXPECTED_MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || ! "$EXPECTED_CONFIG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Bound publication result digests are invalid"
            exit 1
          fi

          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          semver_image="${ghcr_image}:${VERSION}"
          revision_image="${ghcr_image}:${REVISION}"
          digest_image="${ghcr_image}@${EXPECTED_MANIFEST_DIGEST}"
          container="patchpage-reconcile-anonymous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ strategy.job-index }}"
          docker_config="$(mktemp -d)"
          export DOCKER_CONFIG="$docker_config"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker image rm -f "$semver_image" "$revision_image" "$digest_image" >/dev/null 2>&1 || true
            rm -rf "$docker_config"
          }
          trap cleanup EXIT
          docker image rm -f "$semver_image" "$revision_image" "$digest_image" >/dev/null 2>&1 || true

          pull_anonymously() {
            local image="$1"
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                return 0
              fi
              [[ "$attempt" == "5" ]] || sleep 15
            done
            echo "::error::${image} is not anonymously pullable; GHCR Public visibility remains a human release gate"
            return 1
          }

          require_bound_image() {
            local image="$1"
            mapfile -t repo_digests < <(
              docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" \
                | grep -E '^ghcr\.io/allisonmahmood/patchpage-server@sha256:[0-9a-f]{64}$' || true
            )
            if [[ "${#repo_digests[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one anonymous repo digest for ${image}, found ${#repo_digests[@]}"
              return 1
            fi
            local actual_digest="${repo_digests[0]##*@}"
            [[ "$actual_digest" == "$EXPECTED_MANIFEST_DIGEST" ]] || {
              echo "::error::Anonymous ${image} resolved ${actual_digest}, expected bound digest ${EXPECTED_MANIFEST_DIGEST}"
              return 1
            }
            local actual_config
            actual_config="$(docker image inspect --format '{{.Id}}' "$image")"
            [[ "$actual_config" == "$EXPECTED_CONFIG_DIGEST" ]] || {
              echo "::error::Anonymous ${image} config ${actual_config} does not match bound config ${EXPECTED_CONFIG_DIGEST}"
              return 1
            }
          }

          pull_anonymously "$semver_image"
          require_bound_image "$semver_image"
          pull_anonymously "$revision_image"
          require_bound_image "$revision_image"
          pull_anonymously "$digest_image"
          require_bound_image "$digest_image"

          docker run -d \
            --name "$container" \
            -e PATCHPAGE_BOOTSTRAP_API_TOKEN=reconcile-anonymous-health \
            -p 127.0.0.1::3000 \
            "$digest_image"
          host_port="$(
            docker container inspect \
              --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' \
              "$container"
          )"
          [[ -n "$host_port" ]] || { echo "::error::Docker did not publish the server port"; exit 1; }

          for _ in {1..60}; do
            body="$(curl -fsS "http://127.0.0.1:${host_port}/healthz" 2>/dev/null || true)"
            if [[ "$body" == '{"ok":true}' ]]; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container" || true
          echo "::error::Anonymous supported release did not return the exact /healthz response"
          exit 1
