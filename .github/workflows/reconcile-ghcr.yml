          chmod 500 "$tools_dir/validate-docker-save-artifact.mjs" "$tools_dir/ghcr-oci-release.mjs"
          echo "VALIDATE_DOCKER_SAVE_ARTIFACT=$tools_dir/validate-docker-save-artifact.mjs" >> "$GITHUB_ENV"
          echo "GHCR_OCI_RELEASE=$tools_dir/ghcr-oci-release.mjs" >> "$GITHUB_ENV"
      - name: Download replay image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.handoff.outputs.image-artifact-id }}
          path: ${{ runner.temp }}/server-image
          skip-decompress: true
      - name: Validate and load replay image before registry auth
        id: load-image
        shell: bash
        run: |
          set -euo pipefail
          filename="${{ steps.handoff.outputs.filename }}"
          sha256="${{ steps.handoff.outputs.sha256 }}"
          image_id="${{ steps.handoff.outputs.image-id }}"
          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          node "$VALIDATE_DOCKER_SAVE_ARTIFACT" --artifact-dir "$RUNNER_TEMP/server-image" --expected-filename "$filename" --expected-sha256 "$sha256" --expected-repo-tag "${ghcr_image}:${{ matrix.version }}" --expected-config-id "$image_id"
          tar_path="$RUNNER_TEMP/server-image/$filename"
          docker load --input "$tar_path"
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "${ghcr_image}:${{ matrix.version }}")"
          [[ "$loaded_image_id" == "$image_id" ]] || exit 1
          echo "image-tar=$tar_path" >> "$GITHUB_OUTPUT"
      - name: Publish replay image to GHCR and bind its exact result
        id: publish-image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ghcr_name="allisonmahmood/patchpage-server"
          ghcr_image="ghcr.io/${ghcr_name}"
          version="${{ matrix.version }}"
          revision="${{ matrix.revision }}"
          publish_json="$(
            node "$GHCR_OCI_RELEASE" publish-release \
              --registry-url https://ghcr.io \
              --name "$ghcr_name" \
              --version "$version" \
              --revision "$revision" \
              --image-tar "${{ steps.load-image.outputs.image-tar }}" \
              --expected-repo-tag "${ghcr_image}:${version}" \
              --expected-config-id "${{ steps.handoff.outputs.image-id }}" \
              --allow-first-package true
          )"
          printf '%s\n' "$publish_json"
          result_path="$RUNNER_TEMP/reconcile-publish-result-${version}-${revision}.json"
          node - "$publish_json" "$version" "$revision" "$result_path" <<'NODE'
          const fs = require("node:fs");
          const [raw, version, revision, resultPath] = process.argv.slice(2);
          const value = JSON.parse(raw);
          const keys = ["version", "revision", "manifestDigest", "configDigest", "canonical", "repaired"];
          if (JSON.stringify(Object.keys(value)) !== JSON.stringify(keys)) throw new Error("publish result keys are invalid");
          if (value.version !== version || value.revision !== revision) throw new Error("publish result identity does not match the matrix");
          if (!/^sha256:[0-9a-f]{64}$/.test(value.manifestDigest)) throw new Error("publish result manifest digest is invalid");
          if (!/^sha256:[0-9a-f]{64}$/.test(value.configDigest)) throw new Error("publish result config digest is invalid");
          if (!["local", "remote"].includes(value.canonical)) throw new Error("publish result canonical source is invalid");
          if (!Array.isArray(value.repaired) || value.repaired.some((tag) => typeof tag !== "string")) throw new Error("publish result repaired tags are invalid");
          const bound = { version, revision, manifestDigest: value.manifestDigest, configDigest: value.configDigest };
          fs.writeFileSync(resultPath, `${JSON.stringify(bound)}\n`, { encoding: "utf8", flag: "wx", mode: 0o600 });
          NODE
          echo "result-path=$result_path" >> "$GITHUB_OUTPUT"
      - name: Upload immutable replay publication result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.publish-image.outputs.result-path }}
          if-no-files-found: error
          retention-days: 30
          archive: false
          overwrite: true

