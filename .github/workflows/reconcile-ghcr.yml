name: Reconcile GHCR

on:
  workflow_dispatch:
    inputs:
      target:
        description: Optional exact stable release tag, for example v1.2.3
        required: false
        type: string
      batch-size:
        description: Maximum missing or incomplete stable releases to replay
        required: false
        default: "3"
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions: {}

concurrency:
  group: release-ghcr-patchpage-server
  queue: max
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
      complete-count: ${{ steps.plan.outputs.complete-count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TARGET: ${{ inputs.target || '' }}
          INPUT_BATCH_SIZE: ${{ inputs.batch-size || '3' }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_BATCH_SIZE" =~ ^[0-9]+$ ]] || (( INPUT_BATCH_SIZE < 1 || INPUT_BATCH_SIZE > 25 )); then
            echo "::error::batch-size must be an integer from 1 to 25"
            exit 1
          fi
          if [[ -n "$INPUT_TARGET" && ! "$INPUT_TARGET" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::target must be an exact stable vX.Y.Z tag"
            exit 1
          fi
          git fetch --force --tags --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[]' > "$RUNNER_TEMP/github-tags.jsonl"
          node --input-type=module - "$RUNNER_TEMP/github-tags.jsonl" "$INPUT_TARGET" <<'NODE' > "$RUNNER_TEMP/reconcile-candidates.json"
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import {
            isSupportedImageRelease,
            MINIMUM_SUPPORTED_IMAGE_VERSION,
          } from "./scripts/ghcr-oci-release.mjs";
          const [apiPath, target] = process.argv.slice(2);
          const stable = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const apiRows = fs.readFileSync(apiPath, "utf8").trim().split(/\n+/).filter(Boolean).flatMap((line) => JSON.parse(line));
          const apiTags = [...new Set(apiRows.map((row) => row.ref.replace(/^refs\/tags\//, "")).filter((tag) => stable.test(tag)))];
          const localTags = execFileSync("git", ["tag", "--list", "v*"], { encoding: "utf8" }).trim().split(/\n+/).filter(Boolean).filter((tag) => stable.test(tag));
          for (const tag of apiTags) if (!localTags.includes(tag)) throw new Error(`stable GitHub tag ${tag} was not fetched locally`);
          const tags = apiTags
            .filter((tag) => isSupportedImageRelease(tag.slice(1)))
            .sort((a, b) => {
            const left = a.slice(1).split(".").map(BigInt);
            const right = b.slice(1).split(".").map(BigInt);
            for (let i = 0; i < 3; i++) {
              if (left[i] < right[i]) return -1;
              if (left[i] > right[i]) return 1;
            }
            return 0;
          });
          if (target && !isSupportedImageRelease(target.slice(1))) {
            throw new Error(`target ${target} predates first supported image release v${MINIMUM_SUPPORTED_IMAGE_VERSION}`);
          }
          if (target && !tags.includes(target)) throw new Error(`target ${target} is not a stable GitHub tag`);
          const rows = tags.map((tag) => {
            const revision = execFileSync("git", ["rev-list", "-n", "1", tag], { encoding: "utf8" }).trim();
            if (!/^[0-9a-f]{40}$/.test(revision)) throw new Error(`tag ${tag} did not resolve to a commit`);
            return { tag, version: tag.slice(1), revision };
          });
          process.stdout.write(JSON.stringify(rows));
          NODE
          node -e 'process.stdout.write("[]")' > "$RUNNER_TEMP/reconcile-needed.json"
          node -e 'process.stdout.write("[]")' > "$RUNNER_TEMP/reconcile-snapshot.json"
          needed_count=0
          while IFS=$'\t' read -r tag version revision; do
            [[ -n "$tag" ]] || continue
            state="$(node scripts/ghcr-oci-release.mjs inspect-release --registry-url https://ghcr.io --name allisonmahmood/patchpage-server --version "$version" --revision "$revision" --allow-first-package true)"
            status="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$state")"
            node - "$RUNNER_TEMP/reconcile-snapshot.json" "$tag" "$version" "$revision" "$state" <<'NODE'
          const fs = require("node:fs");
          const [path, tag, version, revision, rawState] = process.argv.slice(2);
          const state = JSON.parse(rawState);
          const baseKeys = ["version", "revision", "status"];
          if (state.version !== version || state.revision !== revision) {
            throw new Error(`inspect state identity does not match ${tag}`);
          }
          if (state.status === "complete") {
            const keys = [...baseKeys, "manifestDigest", "configDigest"];
            if (JSON.stringify(Object.keys(state)) !== JSON.stringify(keys)) {
              throw new Error(`complete inspect state keys are invalid for ${tag}`);
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(state.manifestDigest) || !/^sha256:[0-9a-f]{64}$/.test(state.configDigest)) {
              throw new Error(`complete inspect state digests are invalid for ${tag}`);
            }
          } else if (state.status === "missing") {
            if (JSON.stringify(Object.keys(state)) !== JSON.stringify(baseKeys)) {
              throw new Error(`missing inspect state keys are invalid for ${tag}`);
            }
          } else if (state.status === "incomplete") {
            const keys = [...baseKeys, "present", "manifestDigest", "configDigest"];
            if (JSON.stringify(Object.keys(state)) !== JSON.stringify(keys)) {
              throw new Error(`incomplete inspect state keys are invalid for ${tag}`);
            }
            if (!Array.isArray(state.present) || state.present.length !== 1 || !state.present.every((value) => value === version || value === revision)) {
              throw new Error(`incomplete inspect state present tags are invalid for ${tag}`);
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(state.manifestDigest) || !/^sha256:[0-9a-f]{64}$/.test(state.configDigest)) {
              throw new Error(`incomplete inspect state digests are invalid for ${tag}`);
            }
          } else {
            throw new Error(`unexpected inspect status for ${tag}: ${state.status}`);
          }
          const rows = JSON.parse(fs.readFileSync(path, "utf8"));
          const row = { tag, version, revision, status: state.status };
          if (state.status === "complete") {
            row.manifestDigest = state.manifestDigest;
            row.configDigest = state.configDigest;
          }
          rows.push(row);
          fs.writeFileSync(path, JSON.stringify(rows));
          NODE
            if [[ "$status" == "missing" || "$status" == "incomplete" ]]; then
              if [[ -z "$INPUT_TARGET" || "$tag" == "$INPUT_TARGET" ]]; then
                if (( needed_count < INPUT_BATCH_SIZE )); then
                  node - "$RUNNER_TEMP/reconcile-needed.json" "$tag" "$version" "$revision" <<'NODE'
          const fs = require("node:fs");
          const [path, tag, version, revision] = process.argv.slice(2);
          const rows = JSON.parse(fs.readFileSync(path, "utf8"));
          rows.push({ tag, version, revision });
          fs.writeFileSync(path, JSON.stringify(rows));
          NODE
                  needed_count=$((needed_count + 1))
                fi
              fi
            elif [[ "$status" != "complete" ]]; then
              echo "::error::Unexpected inspect status for $tag: $status"
              exit 1
            fi
          done < <(node - "$RUNNER_TEMP/reconcile-candidates.json" <<'NODE'
          const fs = require("node:fs");
          for (const row of JSON.parse(fs.readFileSync(process.argv[2], "utf8"))) {
            console.log(`${row.tag}\t${row.version}\t${row.revision}`);
          }
          NODE
          )
          matrix="$(node -e 'const rows = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(JSON.stringify({include: rows}));' "$RUNNER_TEMP/reconcile-needed.json")"
          count="$(node -e 'process.stdout.write(String(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).length))' "$RUNNER_TEMP/reconcile-needed.json")"
          complete_count="$(node -e 'process.stdout.write(String(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).filter((row) => row.status === "complete").length))' "$RUNNER_TEMP/reconcile-snapshot.json")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          snapshot="$(cat "$RUNNER_TEMP/reconcile-snapshot.json")"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "complete-count=$complete_count" >> "$GITHUB_OUTPUT"

  rebuild:
    if: needs.inspect.outputs.count != '0'
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.inspect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Build, validate, and save exact server image for replay
        id: image
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1

          git fetch --force --tags --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          actual_revision="$(git rev-list -n 1 "$TAG")"
          [[ "$actual_revision" == "$REVISION" ]] || {
            echo "::error::Replay tag $TAG resolved to $actual_revision, expected $REVISION"
            exit 1
          }

          source_dir="$RUNNER_TEMP/replay-source"
          artifact_dir="$RUNNER_TEMP/server-image"
          rm -rf "$source_dir" "$artifact_dir"
          mkdir -p "$artifact_dir"
          git worktree add --detach "$source_dir" "$REVISION"
          cleanup() {
            git worktree remove --force "$source_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          image="ghcr.io/allisonmahmood/patchpage-server:${VERSION}"
          tar_filename="patchpage-server-${VERSION}-${REVISION}-${GITHUB_RUN_ATTEMPT}.tar"
          tar_path="${artifact_dir}/${tar_filename}"
          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            -f "$source_dir/apps/server/Dockerfile" \
            -t "$image" \
            "$source_dir"
          built_image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          scripts/verify-server-image.sh "$image" "$VERSION" "$REVISION"
          verified_image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          [[ "$verified_image_id" == "$built_image_id" ]] || exit 1
          docker save "$image" --output "$tar_path"
          sha256="$(sha256sum "$tar_path" | awk '{print $1}')"
          node scripts/validate-docker-save-artifact.mjs \
            --artifact-dir "$artifact_dir" \
            --expected-filename "$tar_filename" \
            --expected-sha256 "$sha256" \
            --expected-repo-tag "$image" \
            --expected-config-id "$verified_image_id"
          echo "filename=$tar_filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "image-id=$verified_image_id" >> "$GITHUB_OUTPUT"
          echo "config-id=$verified_image_id" >> "$GITHUB_OUTPUT"
          echo "tar-path=$tar_path" >> "$GITHUB_OUTPUT"
      - name: Upload exact replay server image raw tar
        id: image-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.image.outputs.tar-path }}
          if-no-files-found: error
          retention-days: 30
          archive: false
      - name: Write replay handoff
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/reconcile-handoff-${{ matrix.version }}.json" <<JSON
          {"tag":"${{ matrix.tag }}","version":"${{ matrix.version }}","revision":"${{ matrix.revision }}","artifactId":"${{ steps.image-artifact.outputs.artifact-id }}","filename":"${{ steps.image.outputs.filename }}","sha256":"${{ steps.image.outputs.sha256 }}","imageId":"${{ steps.image.outputs.image-id }}","configId":"${{ steps.image.outputs.config-id }}"}
          JSON
      - name: Upload replay handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/reconcile-handoff-${{ matrix.version }}.json
          if-no-files-found: error
          retention-days: 30
          archive: false
          overwrite: true

  publish-ghcr:
    if: needs.inspect.outputs.count != '0'
    needs: [inspect, rebuild]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.inspect.outputs.matrix) }}
    steps:
      - name: Resolve replay handoff artifact ID
        id: handoff-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          handoff_name="reconcile-handoff-${{ matrix.version }}.json"
          mapfile -t handoff_artifact_ids < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${handoff_name}\" and .expired == false) | .id"
          )
          if [[ "${#handoff_artifact_ids[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one replay handoff artifact named ${handoff_name}, found ${#handoff_artifact_ids[@]}"
            exit 1
          fi
          echo "artifact-id=${handoff_artifact_ids[0]}" >> "$GITHUB_OUTPUT"
      - name: Download replay handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.handoff-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/handoff
          skip-decompress: true
      - name: Parse replay handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          node - \
            "$RUNNER_TEMP/handoff" \
            "reconcile-handoff-${{ matrix.version }}.json" \
            "${{ matrix.tag }}" \
            "${{ matrix.version }}" \
            "${{ matrix.revision }}" \
            "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [
            directory,
            expectedHandoffFilename,
            expectedTag,
            expectedVersion,
            expectedRevision,
            outputPath,
          ] = process.argv.slice(2);
          const directoryStat = fs.lstatSync(directory);
          if (!directoryStat.isDirectory() || directoryStat.isSymbolicLink()) {
            throw new Error("handoff path must be a real directory");
          }
          const entries = fs.readdirSync(directory);
          if (entries.length !== 1) {
            throw new Error(`handoff directory must contain exactly one entry, found ${entries.length}`);
          }
          if (entries[0] !== expectedHandoffFilename) {
            throw new Error(`handoff filename ${entries[0]} did not match ${expectedHandoffFilename}`);
          }
          const handoffPath = path.join(directory, entries[0]);
          const handoffStat = fs.lstatSync(handoffPath);
          if (!handoffStat.isFile() || handoffStat.isSymbolicLink() || handoffStat.nlink !== 1) {
            throw new Error("handoff file must be a regular non-link file");
          }
          if (handoffStat.size <= 0 || handoffStat.size > 65536) {
            throw new Error("handoff file size is outside the allowed bound");
          }
          const raw = fs.readFileSync(handoffPath, "utf8");
          const value = JSON.parse(raw);
          const keys = [
            "tag",
            "version",
            "revision",
            "artifactId",
            "filename",
            "sha256",
            "imageId",
            "configId",
          ];
          if (JSON.stringify(Object.keys(value)) !== JSON.stringify(keys)) {
            throw new Error("handoff JSON keys are invalid");
          }
          if (raw !== `${JSON.stringify(value)}\n`) {
            throw new Error("handoff JSON must be canonical");
          }
          const exact = (key, expected) => {
            if (value[key] !== expected) throw new Error(`handoff ${key} ${value[key]} did not match ${expected}`);
          };
          exact("tag", expectedTag);
          exact("version", expectedVersion);
          exact("revision", expectedRevision);
          const escapedVersion = expectedVersion.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const imageFilenamePattern = new RegExp(`^patchpage-server-${escapedVersion}-${expectedRevision}-[1-9][0-9]*\\.tar$`);
          if (typeof value.filename !== "string" || !imageFilenamePattern.test(value.filename)) {
            throw new Error("handoff image filename is invalid for the release identity");
          }
          if (typeof value.artifactId !== "string" || !/^[1-9][0-9]*$/.test(value.artifactId)) throw new Error("handoff artifactId is invalid");
          if (typeof value.sha256 !== "string" || !/^[0-9a-f]{64}$/.test(value.sha256)) throw new Error("handoff sha256 is invalid");
          if (typeof value.imageId !== "string" || !/^sha256:[0-9a-f]{64}$/.test(value.imageId)) throw new Error("handoff imageId is invalid");
          if (value.configId !== value.imageId) throw new Error("handoff configId does not match imageId");
          fs.appendFileSync(outputPath, `image-artifact-id=${value.artifactId}\n`);
          fs.appendFileSync(outputPath, `filename=${value.filename}\n`);
          fs.appendFileSync(outputPath, `sha256=${value.sha256}\n`);
          fs.appendFileSync(outputPath, `image-id=${value.imageId}\n`);
          fs.appendFileSync(outputPath, `config-id=${value.configId}\n`);
          NODE
      - name: Install reviewed checkout-free release tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          rm -rf "$tools_dir"
          install -d -m 700 "$tools_dir"
          validator_sha256="15005064a7edc0b5cd6dd9f6135187a083e407078ac4e40a868dfe490f58603e"
          oci_tool_sha256="53cac4875220e334efa1f647466f35cdeef3c278f3693a5d48f31e1ec29a0eb7"
          cat > "$RUNNER_TEMP/validate-docker-save-artifact.mjs.gz.b64" <<'PATCHPAGE_VALIDATE_DOCKER_SAVE_ARTIFACT'
          H4sIAAAAAAAC/608aXPbRrLf/StGfKotMiYhyXGyWSmyS7HkRLu+ynKySWStBRGgiJgEuAAom9Hyv78+5ugZADqSVO3G4hw93T19z2D+b2NrWZVbF1m+leZX
          Ki+S9EE2XxRlra7VuEzjOv0hrqZqrSZlMVc9HLA7LleLuujtuZGzqo7roYLxyfNslvJfSVYOFXb4syfV1gJ+ZVVaSRBvYUZ8MUv9wVUNkOZyXFYdpunipC6z
          cX3032U88ycs62zmhn+h4kr9Pssu5BD87YYs4noqe/E39D4YF3lVq8Pj749O3n14e6T21dZ/qmn86Kuvd0+3R/+IR5Oz668frze39vTQH45+NuPaBxwePT/4
          8cW7Dy8Pfv7w3S/vjk5g7CNAcWf70WP/HzPj9bNjGP3q+Dni8PLo8Pjgw7tf3uAavXixmGXjuM6KfOsqT6JinEXZPL5Mo3mcZ5O0qqOrnYe/VUXek9BeHPxy
