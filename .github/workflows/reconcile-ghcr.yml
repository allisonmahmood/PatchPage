          const { readFileSync, writeFileSync } = require("node:fs");
          const { gunzipSync } = require("node:zlib");
          writeFileSync(process.argv[3], gunzipSync(Buffer.from(readFileSync(process.argv[2], "utf8").replace(/\s+/g, ""), "base64")));
          NODE
          [[ "$(sha256sum "$tools_dir/validate-docker-save-artifact.mjs" | awk '{print $1}')" == "$validator_sha256" ]] || { echo "::error::Embedded docker-save validator source hash mismatch"; exit 1; }
