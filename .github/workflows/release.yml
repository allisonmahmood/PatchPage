# Tripwire: this filename (release.yml) is registered verbatim in npm's Trusted Publisher config for the "patchpage" package.
# Renaming or moving this file silently breaks npm publishing until the npm-side config is updated.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-ghcr-patchpage-server
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./packages/cli/package.json').version")"
          expected_ref="v${version}"

          if [[ "$expected_ref" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/cli version ${expected_ref}"
            exit 1
          fi

          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a ## [${version}] heading"
            exit 1
          fi

          revision="$(git rev-parse HEAD)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved release revision is not a full commit SHA: ${revision}"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  prepare-npm:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      npm-version: ${{ steps.npm-cli.outputs.version }}
      npm-cli-artifact-id: ${{ steps.npm-cli-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Fetch and verify the reviewed npm CLI
        id: npm-cli
        shell: bash
        env:
          EXPECTED_NPM_VERSION: 11.18.0
          EXPECTED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an exact npm version, got $EXPECTED_NPM_VERSION"
            exit 1
          fi

          npm_tarball="$RUNNER_TEMP/npm-${EXPECTED_NPM_VERSION}.tgz"
          npm_cli_dir="$RUNNER_TEMP/npm-cli"
          rm -f "$npm_tarball"
          rm -rf "$npm_cli_dir"

          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --output "$npm_tarball" \
            "https://registry.npmjs.org/npm/-/npm-${EXPECTED_NPM_VERSION}.tgz"

          actual_integrity="$(
            node - "$npm_tarball" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const digest = createHash("sha512")
            .update(readFileSync(process.argv[2]))
            .digest("base64");
          process.stdout.write(`sha512-${digest}`);
          NODE
          )"

          if [[ "$actual_integrity" != "$EXPECTED_NPM_INTEGRITY" ]]; then
            echo "::error::npm registry tarball integrity mismatch"
            exit 1
          fi

          mkdir -p "$npm_cli_dir"
          tar -xzf "$npm_tarball" -C "$npm_cli_dir" --strip-components=1

          actual_version="$(node "$npm_cli_dir/bin/npm-cli.js" --version)"
          if [[ "$actual_version" != "$EXPECTED_NPM_VERSION" ]]; then
            echo "::error::Verified npm CLI reported $actual_version, expected $EXPECTED_NPM_VERSION"
            exit 1
          fi

          echo "version=$actual_version" >> "$GITHUB_OUTPUT"
      - name: Upload the reviewed npm CLI
        id: npm-cli-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publishing-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cli
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  verify:
    needs: [guard, prepare-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball-filename: ${{ steps.package.outputs.filename }}
      tarball-sha256: ${{ steps.package.outputs.sha256 }}
      package-artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter patchpage build
      - name: Download the isolated npm CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-npm.outputs.npm-cli-artifact-id }}
          path: ${{ runner.temp }}/npm-cli
      - name: Verify the isolated npm CLI
        shell: bash
        env:
          EXPECTED_NPM_VERSION: ${{ needs.prepare-npm.outputs.npm-version }}
        run: |
          set -euo pipefail

          NPM_CLI="$RUNNER_TEMP/npm-cli/bin/npm-cli.js"
          actual_version="$(node "$NPM_CLI" --version)"
          if [[ "$actual_version" != "$EXPECTED_NPM_VERSION" ]]; then
            echo "::error::Downloaded npm CLI reported $actual_version, expected $EXPECTED_NPM_VERSION"
            exit 1
          fi

          echo "NPM_CLI=$NPM_CLI" >> "$GITHUB_ENV"
      - name: Pack exactly one release tarball and verify contents
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/patchpage-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          cd packages/cli
          node "$NPM_CLI" pack \
            --ignore-scripts \
            --json \
            --pack-destination "$package_dir" \
            > "$RUNNER_TEMP/patchpage-pack.json"

          node - "$RUNNER_TEMP/patchpage-pack.json" <<'NODE'
          const fs = require("node:fs");

          const pack = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          const required = ["dist/index.js", "skills/patchpage/SKILL.md", "LICENSE", "README.md"];
          const files = new Set(pack.files.map((file) => file.path));
          const missing = required.filter((file) => !files.has(file));

          if (missing.length > 0) {
            console.error(`Missing files from npm pack: ${missing.join(", ")}`);
            console.error("Packed files:");
            for (const file of [...files].sort()) {
              console.error(`- ${file}`);
            }
            process.exit(1);
          }
          NODE

          reported_tarball="$(
            node - "$RUNNER_TEMP/patchpage-pack.json" "$package_dir" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const pack = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          console.log(path.resolve(process.argv[3], pack.filename));
          NODE
          )"

          mapfile -t tarballs < <(find "$package_dir" -maxdepth 1 -type f -name 'patchpage-*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one PatchPage tarball, found ${#tarballs[@]}"
            exit 1
          fi

          tarball="${tarballs[0]}"
          if [[ "$tarball" != "$reported_tarball" ]]; then
            echo "::error::npm pack reported $reported_tarball, but found $tarball"
            exit 1
          fi

          cli_version="$(node -p "require('./package.json').version")"
          unique_tarball="$package_dir/patchpage-${cli_version}-run-attempt-${GITHUB_RUN_ATTEMPT}.tgz"
          mv -- "$tarball" "$unique_tarball"
          tarball="$unique_tarball"

          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "CLI_VERSION=$cli_version" >> "$GITHUB_ENV"
          echo "tarball-path=$tarball" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      # The published CLI claims engines.node >=22. Verify the packed artifact
      # on the minimum supported Node the way end users get it: a clean
      # npm install of the tarball, no pnpm or repo tooling involved.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install and run tarball on minimum supported Node
        shell: bash
        env:
          EXPECTED_TARBALL_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"
          node "$NPM_CLI" install --ignore-scripts "$TARBALL"

          output="$(./node_modules/.bin/patchpage --version)"
          if [[ "$output" != "$CLI_VERSION" ]]; then
            echo "::error::Expected patchpage --version to print $CLI_VERSION, got $output"
            exit 1
          fi

          if [[ "$output" == "0.0.0-dev" ]]; then
            echo "::error::Installed patchpage binary reported 0.0.0-dev"
            exit 1
          fi

          ./node_modules/.bin/patchpage validate "$GITHUB_WORKSPACE/examples/plan.html"

          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::The tested tarball changed during the smoke install"
            exit 1
          fi

      - name: Upload the exact tested tarball
        id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.tarball-path }}
          if-no-files-found: error
          retention-days: 1
          archive: false

  publish-npm:
    needs: [guard, prepare-npm, verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Download the exact tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.package-artifact-id }}
          path: ${{ runner.temp }}/patchpage-package
          skip-decompress: true
      - name: Download the pinned publishing CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-npm.outputs.npm-cli-artifact-id }}
          path: ${{ runner.temp }}/npm-cli
      - name: Publish the verified tarball to npm
        shell: bash
        env:
          EXPECTED_FILENAME: ${{ needs.verify.outputs.tarball-filename }}
          EXPECTED_NPM_VERSION: ${{ needs.prepare-npm.outputs.npm-version }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball-sha256 }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/patchpage-package"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded PatchPage tarball, found ${#tarballs[@]}"
            exit 1
          fi

          tarball="${tarballs[0]}"
          if [[ "$(basename "$tarball")" != "$EXPECTED_FILENAME" ]]; then
            echo "::error::Downloaded tarball name does not match the verified artifact"
            exit 1
          fi

          actual_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Downloaded tarball digest does not match the verified artifact"
            exit 1
          fi

          IFS=$'\t' read -r package_name package_version < <(
            tar -xOf "$tarball" package/package.json \
              | node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(0, "utf8")); console.log(`${pkg.name}\t${pkg.version}`)'
          )
          if [[ "$package_name" != "patchpage" ]]; then
            echo "::error::Downloaded package is named $package_name, expected patchpage"
            exit 1
          fi
          if [[ "$package_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Downloaded package version $package_version does not match $EXPECTED_VERSION"
            exit 1
          fi

          npm_cli="$RUNNER_TEMP/npm-cli/bin/npm-cli.js"
          actual_npm_version="$(node "$npm_cli" --version)"
          if [[ "$actual_npm_version" != "$EXPECTED_NPM_VERSION" ]]; then
            echo "::error::Downloaded npm CLI reported $actual_npm_version, expected $EXPECTED_NPM_VERSION"
            exit 1
          fi

          registry_metadata="$RUNNER_TEMP/npm-registry-metadata.json"
          curl_error="$RUNNER_TEMP/npm-registry-curl.err"
          registry_url="https://registry.npmjs.org/${package_name}/${EXPECTED_VERSION}"
          if ! http_status="$(
            curl --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --output "$registry_metadata" \
              --write-out '%{http_code}' \
              "$registry_url" \
              2>"$curl_error"
          )"; then
            echo "::error::Failed to query npm registry for patchpage@${EXPECTED_VERSION}"
            cat "$curl_error" >&2
            exit 1
          fi

          case "$http_status" in
            200)
              registry_integrity="$(
                node - "$registry_metadata" <<'NODE'
          const { readFileSync } = require("node:fs");

          const metadata = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const integrity = metadata.dist?.integrity;
          if (typeof integrity === "string" && integrity.length > 0) {
            process.stdout.write(integrity);
          }
          NODE
              )"
              if [[ -z "$registry_integrity" ]]; then
                echo "::error::npm registry metadata is missing dist.integrity"
                exit 1
              fi

              local_integrity="$(
                node - "$tarball" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const digest = createHash("sha512")
            .update(readFileSync(process.argv[2]))
            .digest("base64");
          process.stdout.write(`sha512-${digest}`);
          NODE
              )"
              if [[ "$registry_integrity" != "$local_integrity" ]]; then
                echo "::error::patchpage@${EXPECTED_VERSION} exists with different integrity"
                exit 1
              fi

              echo "patchpage@${EXPECTED_VERSION} already published with matching integrity, skipping"
              exit 0
              ;;
            404)
              echo "patchpage@${EXPECTED_VERSION} is absent from npm; publishing"
              ;;
            *)
              echo "::error::Unexpected npm registry HTTP status: $http_status"
              exit 1
              ;;
          esac

          node "$npm_cli" publish "$tarball" --ignore-scripts --provenance \
            --registry=https://registry.npmjs.org

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | sed -e '1{/^$/d;}' > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::No changelog notes found for ${version}"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists, skipping"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"

  verify-server-image:
    name: Build and verify server image without registry credentials
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tar-filename: ${{ steps.image.outputs.filename }}
      image-tar-sha256: ${{ steps.image.outputs.sha256 }}
      image-id: ${{ steps.image.outputs.image-id }}
      config-id: ${{ steps.image.outputs.config-id }}
      image-artifact-id: ${{ steps.image-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build, verify, and save exact server image
        id: image
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          REVISION: ${{ needs.guard.outputs.revision }}
        run: |
          set -euo pipefail

          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release revision is not a full lowercase commit SHA: $REVISION"
            exit 1
          fi

          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          image="${ghcr_image}:${VERSION}"
          tar_filename="patchpage-server-${VERSION}-${REVISION}-${GITHUB_RUN_ATTEMPT}.tar"
          tar_path="${RUNNER_TEMP}/${tar_filename}"

          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            -f apps/server/Dockerfile \
            -t "$image" .

          built_image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          scripts/verify-server-image.sh "$image" "$VERSION" "$REVISION"

          verified_image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if [[ "$verified_image_id" != "$built_image_id" ]]; then
            echo "::error::Verified image changed before artifact handoff"
            exit 1
          fi
          if [[ ! "$verified_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Verified image ID is not a sha256 digest: $verified_image_id"
            exit 1
          fi

          rm -f "$tar_path"
          docker save "$image" --output "$tar_path"
          sha256="$(sha256sum "$tar_path" | awk '{print $1}')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Saved image tar SHA-256 is invalid: $sha256"
            exit 1
          fi

          # Docker image IDs are content digests of the image config object.
          echo "filename=$tar_filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "image-id=$verified_image_id" >> "$GITHUB_OUTPUT"
          echo "config-id=$verified_image_id" >> "$GITHUB_OUTPUT"
      - name: Upload exact verified server image raw tar
        id: image-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/${{ steps.image.outputs.filename }}
          if-no-files-found: error
          retention-days: 1
          archive: false

  docker-ghcr:
    name: Publish verified server image to GHCR (no checkout)
    needs: [guard, publish-npm, verify-server-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      manifest-digest: ${{ steps.publish-image.outputs.manifest-digest }}
    steps:
      - name: Download the immutable verified server image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-server-image.outputs.image-artifact-id }}
          path: ${{ runner.temp }}/server-image
          skip-decompress: true
      - name: Validate and load the verified server image artifact before login
        id: load-image
        shell: bash
        env:
          EXPECTED_CONFIG_ID: ${{ needs.verify-server-image.outputs.config-id }}
          EXPECTED_FILENAME: ${{ needs.verify-server-image.outputs.image-tar-filename }}
          EXPECTED_IMAGE_ID: ${{ needs.verify-server-image.outputs.image-id }}
          EXPECTED_SHA256: ${{ needs.verify-server-image.outputs.image-tar-sha256 }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          expected_local_tag="${ghcr_image}:${EXPECTED_VERSION}"

          if [[ ! "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected image ID is invalid: $EXPECTED_IMAGE_ID"
            exit 1
          fi
          if [[ "$EXPECTED_CONFIG_ID" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error::Expected config ID does not match image ID"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected image artifact SHA-256 is invalid: $EXPECTED_SHA256"
            exit 1
          fi

          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/server-image"/*.tar)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded server image tar, found ${#tarballs[@]}"
            exit 1
          fi

          tar_path="${tarballs[0]}"
          if [[ "$(basename "$tar_path")" != "$EXPECTED_FILENAME" ]]; then
            echo "::error::Downloaded server image tar name does not match the verified artifact"
            exit 1
          fi

          actual_sha256="$(sha256sum "$tar_path" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Downloaded server image tar digest does not match the verified artifact"
            exit 1
          fi

          docker load --input "$tar_path"
          if ! loaded_image_id="$(
            docker image inspect --format '{{.Id}}' "$expected_local_tag" 2>/dev/null
          )"; then
            echo "::error::Loaded artifact does not contain the expected local release tag"
            exit 1
          fi
          if [[ "$loaded_image_id" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error::Loaded local release tag image ID does not match the verified artifact"
            exit 1
          fi

          rm -f "$tar_path"
          echo "local-tag=$expected_local_tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Publish or accept immutable GHCR tags, then reconcile latest
        id: publish-image
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ needs.verify-server-image.outputs.image-id }}
          EXPECTED_REVISION: ${{ needs.guard.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
          LOCAL_RELEASE_TAG: ${{ steps.load-image.outputs.local-tag }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected revision is not a full lowercase commit SHA: $EXPECTED_REVISION"
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected version is not exact stable semver: $EXPECTED_VERSION"
            exit 1
          fi

          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          semver_target="${ghcr_image}:${EXPECTED_VERSION}"
          revision_target="${ghcr_image}:${EXPECTED_REVISION}"
          latest_target="${ghcr_image}:latest"
          immutable_targets=("$semver_target" "$revision_target")
          verified_manifest_digest=""
          declare -A immutable_state

          inspect_remote_target() {
            local target="$1"
            local digest_var="$2"
            local config_var="$3"
            local tag="${target##*:}"
            local inspect_output="${RUNNER_TEMP}/ghcr-inspect-${tag}.txt"
            local manifest_json="${RUNNER_TEMP}/ghcr-manifest-${tag}.json"
            local inspect_error="${RUNNER_TEMP}/ghcr-inspect-${tag}.err"

            if ! docker buildx imagetools inspect "$target" >"$inspect_output" 2>"$inspect_error"; then
              if grep -Eiq "manifest unknown|no such manifest|not found|name unknown|404" "$inspect_error"; then
                return 1
              fi
              echo "::error::Could not inspect GHCR tag state for ${target}"
              cat "$inspect_error" >&2
              exit 1
            fi

            local digest
            digest="$(
              sed -nE 's/^[[:space:]]*Digest:[[:space:]]+(sha256:[0-9a-f]{64}).*/\1/p' \
                "$inspect_output" | head -n1
            )"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not determine remote manifest digest for ${target}"
              cat "$inspect_output" >&2
              exit 1
            fi

            if ! docker buildx imagetools inspect --raw "$target" >"$manifest_json" 2>"$inspect_error"; then
              echo "::error::Could not fetch raw remote manifest for ${target}"
              cat "$inspect_error" >&2
              exit 1
            fi

            local config_id
            if ! config_id="$(
              python3 - "$manifest_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              manifest = json.load(handle)

          if "manifests" in manifest:
              raise SystemExit("release tag points at an image index, not a single verified image")

          config = manifest.get("config", {}).get("digest")
          if not isinstance(config, str) or not config.startswith("sha256:"):
              raise SystemExit("remote manifest is missing a config digest")

          print(config)
          PY
            )"; then
              echo "::error::Could not determine remote config digest for ${target}"
              exit 1
            fi

            printf -v "$digest_var" '%s' "$digest"
            printf -v "$config_var" '%s' "$config_id"
            return 0
          }

          record_verified_digest() {
            local target="$1"
            local digest="$2"

            if [[ -z "$verified_manifest_digest" ]]; then
              verified_manifest_digest="$digest"
              return
            fi
            if [[ "$digest" != "$verified_manifest_digest" ]]; then
              echo "::error::${target} digest ${digest} does not match previously verified GHCR digest ${verified_manifest_digest}"
              exit 1
            fi
          }

          push_verified_target() {
            local target="$1"
            local push_output=""
            local push_digest=""
            local remote_digest=""
            local remote_config_id=""

            docker tag "$LOCAL_RELEASE_TAG" "$target"
            target_image_id="$(docker image inspect --format '{{.Id}}' "$target")"
            if [[ "$target_image_id" != "$EXPECTED_IMAGE_ID" ]]; then
              echo "::error::${target} does not reference the verified image before push"
              exit 1
            fi

            if ! push_output="$(docker push "$target" 2>&1)"; then
              printf '%s\n' "$push_output" >&2
              exit 1
            fi
            printf '%s\n' "$push_output"

            push_digest="$(
              sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$push_output" | tail -n1
            )"
            if [[ ! "$push_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not determine pushed digest for ${target}"
              exit 1
            fi

            if ! inspect_remote_target "$target" remote_digest remote_config_id; then
              echo "::error::Pushed GHCR tag is missing: ${target}"
              exit 1
            fi
            if [[ "$remote_digest" != "$push_digest" ]]; then
              echo "::error::${target} remote digest ${remote_digest} drifted from pushed digest ${push_digest}"
              exit 1
            fi
            if [[ "$remote_config_id" != "$EXPECTED_IMAGE_ID" ]]; then
              echo "::error::${target} remote config ${remote_config_id} does not match ${EXPECTED_IMAGE_ID}"
              exit 1
            fi

            record_verified_digest "$target" "$remote_digest"
          }

          for target in "${immutable_targets[@]}"; do
            remote_digest=""
            remote_config_id=""
            if inspect_remote_target "$target" remote_digest remote_config_id; then
              if [[ "$remote_config_id" != "$EXPECTED_IMAGE_ID" ]]; then
                echo "::error::Existing immutable GHCR tag ${target} has config ${remote_config_id}, expected ${EXPECTED_IMAGE_ID}"
                exit 1
              fi
              if ! docker pull "$target"; then
                echo "::error::Could not pull existing immutable GHCR tag ${target}"
                exit 1
              fi
              pulled_image_id="$(docker image inspect --format '{{.Id}}' "$target")"
              if [[ "$pulled_image_id" != "$EXPECTED_IMAGE_ID" ]]; then
                echo "::error::Pulled immutable GHCR tag ${target} image ID ${pulled_image_id} does not match ${EXPECTED_IMAGE_ID}"
                exit 1
              fi

              immutable_state["$target"]="present"
              record_verified_digest "$target" "$remote_digest"
              echo "Immutable GHCR tag ${target} already exists with verified image ID ${remote_config_id} and digest ${remote_digest}"
            else
              immutable_state["$target"]="missing"
            fi
          done

          for target in "${immutable_targets[@]}"; do
            if [[ "${immutable_state[$target]}" == "missing" ]]; then
              push_verified_target "$target"
            fi
          done

          if [[ ! "$verified_manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Immutable GHCR tags did not establish the current release manifest digest"
            exit 1
          fi

          latest_remote_digest=""
          latest_remote_config_id=""
          if inspect_remote_target "$latest_target" latest_remote_digest latest_remote_config_id; then
            if ! docker pull "$latest_target"; then
              echo "::error::Could not pull existing latest GHCR tag ${latest_target}"
              exit 1
            fi
            latest_pulled_image_id="$(docker image inspect --format '{{.Id}}' "$latest_target")"
            if [[ "$latest_pulled_image_id" != "$latest_remote_config_id" ]]; then
              echo "::error::Latest GHCR tag raw manifest config ${latest_remote_config_id} does not match pulled image ID ${latest_pulled_image_id}"
              exit 1
            fi

            latest_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$latest_target")"
            if [[ ! "$latest_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Existing latest GHCR tag version metadata is invalid: ${latest_version}"
              exit 1
            fi

            if ! latest_comparison="$(
              python3 - "$latest_version" "$EXPECTED_VERSION" <<'PY'
          import re
          import sys

          existing, expected = sys.argv[1:3]
          pattern = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          if not pattern.match(existing) or not pattern.match(expected):
              raise SystemExit("versions must be exact stable semver")

          existing_parts = [int(part) for part in existing.split(".")]
          expected_parts = [int(part) for part in expected.split(".")]

          if existing_parts < expected_parts:
              print("older")
          elif existing_parts == expected_parts:
              print("equal")
          elif existing_parts > expected_parts:
              print("newer")
          else:
              raise SystemExit("unknown comparison")
          PY
            )"; then
              echo "::error::Could not compare existing latest version ${latest_version} with ${EXPECTED_VERSION}"
              exit 1
            fi

            case "$latest_comparison" in
              older)
                echo "Existing latest GHCR tag version ${latest_version} is older than current release ${EXPECTED_VERSION}; updating latest"
                push_verified_target "$latest_target"
                ;;
              equal)
                if [[ "$latest_remote_config_id" != "$EXPECTED_IMAGE_ID" ]]; then
                  echo "::error::Existing latest GHCR tag for ${EXPECTED_VERSION} has config ${latest_remote_config_id}, expected ${EXPECTED_IMAGE_ID}"
                  exit 1
                fi
                if [[ "$latest_remote_digest" != "$verified_manifest_digest" ]]; then
                  echo "::error::Existing latest GHCR tag for ${EXPECTED_VERSION} has manifest digest ${latest_remote_digest}, expected current release digest ${verified_manifest_digest}"
                  exit 1
                fi
                echo "Latest GHCR tag already points at current release ${EXPECTED_VERSION} with verified digest ${latest_remote_digest}"
                ;;
              newer)
                echo "Existing latest GHCR tag version ${latest_version} is newer than current release ${EXPECTED_VERSION}; leaving latest untouched"
                ;;
              *)
                echo "::error::Unknown latest semver comparison result: ${latest_comparison}"
                exit 1
                ;;
            esac
          else
            echo "Latest GHCR tag is absent; publishing current release ${EXPECTED_VERSION}"
            push_verified_target "$latest_target"
          fi

          echo "manifest-digest=$verified_manifest_digest" >> "$GITHUB_OUTPUT"

  ghcr-anonymous-smoke:
    name: Anonymous GHCR public-visibility gate (manual visibility required)
    needs: [guard, docker-ghcr]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify public pull, publisher digest, and health without credentials
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.docker-ghcr.outputs.manifest-digest }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Publisher did not expose a valid GHCR manifest digest"
            exit 1
          fi

          image="ghcr.io/allisonmahmood/patchpage-server:${{ needs.guard.outputs.version }}"
          container="patchpage-server-anonymous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_config="$(mktemp -d)"
          export DOCKER_CONFIG="$docker_config"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$docker_config"
          }
          trap cleanup EXIT

          pulled=""
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              pulled="true"
              break
            fi

            if [[ "$attempt" != "5" ]]; then
              sleep 15
            fi
          done

          if [[ "$pulled" != "true" ]]; then
            echo "::error::Published image was not anonymously pullable. The first GHCR package still requires the maintainer GHCR Public visibility step; this workflow does not change package visibility."
            exit 1
          fi

          mapfile -t repo_digests < <(
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" \
              | grep -E '^ghcr\.io/allisonmahmood/patchpage-server@sha256:[0-9a-f]{64}$' || true
          )
          if [[ "${#repo_digests[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one anonymous repo digest for ${image}, found ${#repo_digests[@]}"
            exit 1
          fi
          actual_digest="${repo_digests[0]##*@}"
          if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Anonymous repo digest ${actual_digest} does not match the publisher-verified GHCR digest ${EXPECTED_DIGEST}"
            exit 1
          fi

          docker run -d --name "$container" -p 127.0.0.1::3000 "$image"
          host_port="$(
            docker container inspect \
              --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' \
              "$container"
          )"
          if [[ -z "$host_port" ]]; then
            echo "::error::Docker did not publish the server port"
            exit 1
          fi

          for _ in {1..60}; do
            body="$(curl -fsS "http://127.0.0.1:${host_port}/healthz" 2>/dev/null || true)"
            if [[ "$body" == '{"ok":true}' ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container" || true
          echo "::error::Published image did not return the expected /healthz response"
          exit 1

  npx-smoke:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Smoke test published npm package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"

          for attempt in 1 2 3 4 5; do
            if output="$(npx -y "patchpage@${version}" --version 2>npx-smoke.err)"; then
              if [[ "$output" == "$version" ]]; then
                exit 0
              fi

              echo "Attempt ${attempt}: expected ${version}, got ${output}"
            else
              echo "Attempt ${attempt}: npx failed"
              cat npx-smoke.err || true
            fi

            if [[ "$attempt" != "5" ]]; then
              sleep 30
            fi
          done

          echo "::error::npx patchpage@${version} did not print the expected version"
          exit 1
