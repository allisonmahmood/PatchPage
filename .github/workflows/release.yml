          node - "$RUNNER_TEMP/validate-docker-save-artifact.mjs.gz.b64" "$tools_dir/validate-docker-save-artifact.mjs" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const { gunzipSync } = require("node:zlib");
          const payload = readFileSync(process.argv[2], "utf8").replace(/\s+/g, "");
          writeFileSync(process.argv[3], gunzipSync(Buffer.from(payload, "base64")));
          NODE
          node - "$RUNNER_TEMP/ghcr-oci-release.mjs.gz.b64" "$tools_dir/ghcr-oci-release.mjs" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const { gunzipSync } = require("node:zlib");
          const payload = readFileSync(process.argv[2], "utf8").replace(/\s+/g, "");
          writeFileSync(process.argv[3], gunzipSync(Buffer.from(payload, "base64")));
          NODE

          actual_validator_sha256="$(sha256sum "$tools_dir/validate-docker-save-artifact.mjs" | awk '{print $1}')"
          if [[ "$actual_validator_sha256" != "$validator_sha256" ]]; then
            echo "::error::Embedded docker-save validator source hash mismatch"
            exit 1
          fi
          actual_oci_tool_sha256="$(sha256sum "$tools_dir/ghcr-oci-release.mjs" | awk '{print $1}')"
          if [[ "$actual_oci_tool_sha256" != "$oci_tool_sha256" ]]; then
            echo "::error::Embedded OCI release tool source hash mismatch"
            exit 1
          fi

          chmod 500 "$tools_dir/validate-docker-save-artifact.mjs" "$tools_dir/ghcr-oci-release.mjs"
          echo "VALIDATE_DOCKER_SAVE_ARTIFACT=$tools_dir/validate-docker-save-artifact.mjs" >> "$GITHUB_ENV"
          echo "GHCR_OCI_RELEASE=$tools_dir/ghcr-oci-release.mjs" >> "$GITHUB_ENV"
      - name: Validate and load the verified server image artifact before registry auth
        id: load-image
        shell: bash
        env:
          EXPECTED_CONFIG_ID: ${{ needs.verify-server-image.outputs.config-id }}
          EXPECTED_FILENAME: ${{ needs.verify-server-image.outputs.image-tar-filename }}
          EXPECTED_IMAGE_ID: ${{ needs.verify-server-image.outputs.image-id }}
          EXPECTED_SHA256: ${{ needs.verify-server-image.outputs.image-tar-sha256 }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          expected_local_tag="${ghcr_image}:${EXPECTED_VERSION}"

          if [[ ! "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected image ID is invalid: $EXPECTED_IMAGE_ID"
            exit 1
          fi
          if [[ "$EXPECTED_CONFIG_ID" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error::Expected config ID does not match image ID"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected image artifact SHA-256 is invalid: $EXPECTED_SHA256"
            exit 1
          fi

          node "$VALIDATE_DOCKER_SAVE_ARTIFACT" \
            --artifact-dir "$RUNNER_TEMP/server-image" \
            --expected-filename "$EXPECTED_FILENAME" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --expected-repo-tag "$expected_local_tag" \
            --expected-config-id "$EXPECTED_IMAGE_ID"

          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/server-image"/*.tar)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded server image tar, found ${#tarballs[@]}"
            exit 1
          fi
          tar_path="${tarballs[0]}"

          docker load --input "$tar_path"
          if ! loaded_image_id="$(
            docker image inspect --format '{{.Id}}' "$expected_local_tag" 2>/dev/null
          )"; then
            echo "::error::Loaded artifact does not contain the expected local release tag"
            exit 1
          fi
          if [[ "$loaded_image_id" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error::Loaded local release tag image ID does not match the verified artifact"
            exit 1
          fi

          echo "image-tar=$tar_path" >> "$GITHUB_OUTPUT"
      - name: Publish or accept the release tag pair with exact OCI state, then reconcile latest
        id: publish-image
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ needs.verify-server-image.outputs.image-id }}
          EXPECTED_REVISION: ${{ needs.guard.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
          GHCR_IMAGE_TAR: ${{ steps.load-image.outputs.image-tar }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected revision is not a full lowercase commit SHA: $EXPECTED_REVISION"
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected version is not exact stable semver: $EXPECTED_VERSION"
            exit 1
          fi

          ghcr_name="allisonmahmood/patchpage-server"
          ghcr_image="ghcr.io/${ghcr_name}"
          release_json="$(
            node "$GHCR_OCI_RELEASE" publish-release \
              --registry-url https://ghcr.io \
              --name "$ghcr_name" \
              --version "$EXPECTED_VERSION" \
              --revision "$EXPECTED_REVISION" \
              --image-tar "$GHCR_IMAGE_TAR" \
              --expected-repo-tag "${ghcr_image}:${EXPECTED_VERSION}" \
              --expected-config-id "$EXPECTED_IMAGE_ID" \
              --allow-first-package true
          )"
          printf '%s\n' "$release_json"

          manifest_digest="$(
            node -e 'const state = JSON.parse(process.argv[1]); if (!/^sha256:[0-9a-f]{64}$/.test(state.manifestDigest)) process.exit(1); process.stdout.write(state.manifestDigest);' "$release_json"
          )"
          config_digest="$(
            node -e 'const state = JSON.parse(process.argv[1]); if (!/^sha256:[0-9a-f]{64}$/.test(state.configDigest)) process.exit(1); process.stdout.write(state.configDigest);' "$release_json"
          )"

          latest_json="$(
            node "$GHCR_OCI_RELEASE" reconcile-latest \
              --registry-url https://ghcr.io \
              --name "$ghcr_name"
          )"
          printf '%s\n' "$latest_json"

          echo "config-digest=$config_digest" >> "$GITHUB_OUTPUT"
          echo "manifest-digest=$manifest_digest" >> "$GITHUB_OUTPUT"

  ghcr-anonymous-smoke:
    name: Anonymous GHCR public-visibility gate (manual visibility required)
    needs: [guard, docker-ghcr]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify the semver tag, exact digest, config, and health without credentials
        shell: bash
        env:
          EXPECTED_CONFIG_ID: ${{ needs.docker-ghcr.outputs.config-digest }}
          EXPECTED_DIGEST: ${{ needs.docker-ghcr.outputs.manifest-digest }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Publisher did not expose a valid GHCR manifest digest"
            exit 1
          fi
          if [[ ! "$EXPECTED_CONFIG_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Verifier did not expose a valid image config digest"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Guard did not expose an exact stable semver"
            exit 1
          fi

          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          tag_image="${ghcr_image}:${VERSION}"
          digest_image="${ghcr_image}@${EXPECTED_DIGEST}"
          container="patchpage-server-anonymous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_config="$(mktemp -d)"
          export DOCKER_CONFIG="$docker_config"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker image rm -f "$tag_image" "$digest_image" >/dev/null 2>&1 || true
            rm -rf "$docker_config"
          }
          trap cleanup EXIT
          docker image rm -f "$tag_image" "$digest_image" >/dev/null 2>&1 || true

          pull_anonymously() {
            local image="$1"
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                return 0
              fi
              [[ "$attempt" == "5" ]] || sleep 15
            done
            echo "::error::Published image was not anonymously pullable. The first GHCR package still requires the maintainer GHCR Public visibility step; this workflow does not change package visibility."
            return 1
          }

          require_publisher_binding() {
            local image="$1"
            mapfile -t repo_digests < <(
              docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" \
                | grep -E '^ghcr\.io/allisonmahmood/patchpage-server@sha256:[0-9a-f]{64}$' || true
            )
            if [[ "${#repo_digests[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one anonymous repo digest for ${image}, found ${#repo_digests[@]}"
              return 1
            fi
            local actual_digest="${repo_digests[0]##*@}"
            [[ "$actual_digest" == "$EXPECTED_DIGEST" ]] || {
              echo "::error::Anonymous ${image} resolved ${actual_digest}, expected publisher-bound digest ${EXPECTED_DIGEST}"
              return 1
            }
            local actual_config
            actual_config="$(docker image inspect --format '{{.Id}}' "$image")"
            [[ "$actual_config" == "$EXPECTED_CONFIG_ID" ]] || {
              echo "::error::Anonymous ${image} config ${actual_config} does not match verified config ${EXPECTED_CONFIG_ID}"
              return 1
            }
          }

          pull_anonymously "$tag_image"
          require_publisher_binding "$tag_image"
          pull_anonymously "$digest_image"
          require_publisher_binding "$digest_image"

          docker run -d --name "$container" -p 127.0.0.1::3000 "$digest_image"
          host_port="$(
            docker container inspect \
              --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' \
              "$container"
          )"
          if [[ -z "$host_port" ]]; then
            echo "::error::Docker did not publish the server port"
            exit 1
          fi

          for _ in {1..60}; do
            body="$(curl -fsS "http://127.0.0.1:${host_port}/healthz" 2>/dev/null || true)"
            if [[ "$body" == '{"ok":true}' ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container" || true
          echo "::error::Published image did not return the expected /healthz response"
          exit 1

  npx-smoke:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Smoke test published npm package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"

          for attempt in 1 2 3 4 5; do
            if output="$(npx -y "patchpage@${version}" --version 2>npx-smoke.err)"; then
              if [[ "$output" == "$version" ]]; then
                exit 0
              fi

              echo "Attempt ${attempt}: expected ${version}, got ${output}"
            else
              echo "Attempt ${attempt}: npx failed"
              cat npx-smoke.err || true
            fi

            if [[ "$attempt" != "5" ]]; then
              sleep 30
            fi
          done

          echo "::error::npx patchpage@${version} did not print the expected version"
          exit 1
