# Tripwire: this filename (release.yml) is registered verbatim in npm's Trusted Publisher config for the "patchpage" package.
# Renaming or moving this file silently breaks npm publishing until the npm-side config is updated.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./packages/cli/package.json').version")"
          expected_ref="v${version}"

          if [[ "$expected_ref" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/cli version ${expected_ref}"
            exit 1
          fi

          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a ## [${version}] heading"
            exit 1
          fi

          revision="$(git rev-parse HEAD)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved release revision is not a full commit SHA: ${revision}"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  prepare-npm:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      npm-version: ${{ steps.npm-cli.outputs.version }}
      npm-cli-artifact-id: ${{ steps.npm-cli-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Fetch and verify the reviewed npm CLI
        id: npm-cli
        shell: bash
        env:
          EXPECTED_NPM_VERSION: 11.18.0
          EXPECTED_NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an exact npm version, got $EXPECTED_NPM_VERSION"
            exit 1
          fi

          npm_tarball="$RUNNER_TEMP/npm-${EXPECTED_NPM_VERSION}.tgz"
          npm_cli_dir="$RUNNER_TEMP/npm-cli"
          rm -f "$npm_tarball"
          rm -rf "$npm_cli_dir"

          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --output "$npm_tarball" \
            "https://registry.npmjs.org/npm/-/npm-${EXPECTED_NPM_VERSION}.tgz"

          actual_integrity="$(
            node - "$npm_tarball" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const digest = createHash("sha512")
            .update(readFileSync(process.argv[2]))
            .digest("base64");
          process.stdout.write(`sha512-${digest}`);
          NODE
          )"

          if [[ "$actual_integrity" != "$EXPECTED_NPM_INTEGRITY" ]]; then
            echo "::error::npm registry tarball integrity mismatch"
            exit 1
          fi

          mkdir -p "$npm_cli_dir"
          tar -xzf "$npm_tarball" -C "$npm_cli_dir" --strip-components=1

          actual_version="$(node "$npm_cli_dir/bin/npm-cli.js" --version)"
          if [[ "$actual_version" != "$EXPECTED_NPM_VERSION" ]]; then
            echo "::error::Verified npm CLI reported $actual_version, expected $EXPECTED_NPM_VERSION"
            exit 1
          fi

          echo "version=$actual_version" >> "$GITHUB_OUTPUT"
      - name: Upload the reviewed npm CLI
        id: npm-cli-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publishing-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cli
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  verify:
    needs: [guard, prepare-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball-filename: ${{ steps.package.outputs.filename }}
      tarball-sha256: ${{ steps.package.outputs.sha256 }}
      package-artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter patchpage build
      - name: Download the isolated npm CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-npm.outputs.npm-cli-artifact-id }}
          path: ${{ runner.temp }}/npm-cli
      - name: Verify the isolated npm CLI
        shell: bash
        env:
          EXPECTED_NPM_VERSION: ${{ needs.prepare-npm.outputs.npm-version }}
        run: |
          set -euo pipefail

          NPM_CLI="$RUNNER_TEMP/npm-cli/bin/npm-cli.js"
          actual_version="$(node "$NPM_CLI" --version)"
          if [[ "$actual_version" != "$EXPECTED_NPM_VERSION" ]]; then
            echo "::error::Downloaded npm CLI reported $actual_version, expected $EXPECTED_NPM_VERSION"
            exit 1
          fi

          echo "NPM_CLI=$NPM_CLI" >> "$GITHUB_ENV"
      - name: Pack exactly one release tarball and verify contents
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/patchpage-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          cd packages/cli
          node "$NPM_CLI" pack \
            --ignore-scripts \
            --json \
            --pack-destination "$package_dir" \
            > "$RUNNER_TEMP/patchpage-pack.json"

          node - "$RUNNER_TEMP/patchpage-pack.json" <<'NODE'
          const fs = require("node:fs");

          const pack = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          const required = ["dist/index.js", "skills/patchpage/SKILL.md", "LICENSE", "README.md"];
          const files = new Set(pack.files.map((file) => file.path));
          const missing = required.filter((file) => !files.has(file));

          if (missing.length > 0) {
            console.error(`Missing files from npm pack: ${missing.join(", ")}`);
            console.error("Packed files:");
            for (const file of [...files].sort()) {
              console.error(`- ${file}`);
            }
            process.exit(1);
          }
          NODE

          reported_tarball="$(
            node - "$RUNNER_TEMP/patchpage-pack.json" "$package_dir" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const pack = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          console.log(path.resolve(process.argv[3], pack.filename));
          NODE
          )"

          mapfile -t tarballs < <(find "$package_dir" -maxdepth 1 -type f -name 'patchpage-*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one PatchPage tarball, found ${#tarballs[@]}"
            exit 1
          fi

          tarball="${tarballs[0]}"
          if [[ "$tarball" != "$reported_tarball" ]]; then
            echo "::error::npm pack reported $reported_tarball, but found $tarball"
            exit 1
          fi

          cli_version="$(node -p "require('./package.json').version")"
          unique_tarball="$package_dir/patchpage-${cli_version}-run-attempt-${GITHUB_RUN_ATTEMPT}.tgz"
          mv -- "$tarball" "$unique_tarball"
          tarball="$unique_tarball"

          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "CLI_VERSION=$cli_version" >> "$GITHUB_ENV"
          echo "tarball-path=$tarball" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      # The published CLI claims engines.node >=22. Verify the packed artifact
      # on the minimum supported Node the way end users get it: a clean
      # npm install of the tarball, no pnpm or repo tooling involved.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install and run tarball on minimum supported Node
        shell: bash
        env:
          EXPECTED_TARBALL_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"
          node "$NPM_CLI" install --ignore-scripts "$TARBALL"

          output="$(./node_modules/.bin/patchpage --version)"
          if [[ "$output" != "$CLI_VERSION" ]]; then
            echo "::error::Expected patchpage --version to print $CLI_VERSION, got $output"
            exit 1
          fi

          if [[ "$output" == "0.0.0-dev" ]]; then
            echo "::error::Installed patchpage binary reported 0.0.0-dev"
            exit 1
          fi

          ./node_modules/.bin/patchpage validate "$GITHUB_WORKSPACE/examples/plan.html"

          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::The tested tarball changed during the smoke install"
            exit 1
          fi

      - name: Upload the exact tested tarball
        id: package-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.tarball-path }}
          if-no-files-found: error
          retention-days: 1
          archive: false

  publish-npm:
    needs: [guard, prepare-npm, verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Download the exact tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.package-artifact-id }}
          path: ${{ runner.temp }}/patchpage-package
          skip-decompress: true
      - name: Download the pinned publishing CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-npm.outputs.npm-cli-artifact-id }}
          path: ${{ runner.temp }}/npm-cli
      - name: Publish the verified tarball to npm
        shell: bash
        env:
          EXPECTED_FILENAME: ${{ needs.verify.outputs.tarball-filename }}
          EXPECTED_NPM_VERSION: ${{ needs.prepare-npm.outputs.npm-version }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball-sha256 }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/patchpage-package"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded PatchPage tarball, found ${#tarballs[@]}"
            exit 1
          fi

          tarball="${tarballs[0]}"
          if [[ "$(basename "$tarball")" != "$EXPECTED_FILENAME" ]]; then
            echo "::error::Downloaded tarball name does not match the verified artifact"
            exit 1
          fi

          actual_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Downloaded tarball digest does not match the verified artifact"
            exit 1
          fi

          IFS=$'\t' read -r package_name package_version < <(
            tar -xOf "$tarball" package/package.json \
              | node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(0, "utf8")); console.log(`${pkg.name}\t${pkg.version}`)'
          )
          if [[ "$package_name" != "patchpage" ]]; then
            echo "::error::Downloaded package is named $package_name, expected patchpage"
            exit 1
          fi
          if [[ "$package_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Downloaded package version $package_version does not match $EXPECTED_VERSION"
            exit 1
          fi

          npm_cli="$RUNNER_TEMP/npm-cli/bin/npm-cli.js"
          actual_npm_version="$(node "$npm_cli" --version)"
          if [[ "$actual_npm_version" != "$EXPECTED_NPM_VERSION" ]]; then
            echo "::error::Downloaded npm CLI reported $actual_npm_version, expected $EXPECTED_NPM_VERSION"
            exit 1
          fi

          registry_metadata="$RUNNER_TEMP/npm-registry-metadata.json"
          curl_error="$RUNNER_TEMP/npm-registry-curl.err"
          registry_url="https://registry.npmjs.org/${package_name}/${EXPECTED_VERSION}"
          if ! http_status="$(
            curl --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --output "$registry_metadata" \
              --write-out '%{http_code}' \
              "$registry_url" \
              2>"$curl_error"
          )"; then
            echo "::error::Failed to query npm registry for patchpage@${EXPECTED_VERSION}"
            cat "$curl_error" >&2
            exit 1
          fi

          case "$http_status" in
            200)
              registry_integrity="$(
                node - "$registry_metadata" <<'NODE'
          const { readFileSync } = require("node:fs");

          const metadata = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const integrity = metadata.dist?.integrity;
          if (typeof integrity === "string" && integrity.length > 0) {
            process.stdout.write(integrity);
          }
          NODE
              )"
              if [[ -z "$registry_integrity" ]]; then
                echo "::error::npm registry metadata is missing dist.integrity"
                exit 1
              fi

              local_integrity="$(
                node - "$tarball" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");

          const digest = createHash("sha512")
            .update(readFileSync(process.argv[2]))
            .digest("base64");
          process.stdout.write(`sha512-${digest}`);
          NODE
              )"
              if [[ "$registry_integrity" != "$local_integrity" ]]; then
                echo "::error::patchpage@${EXPECTED_VERSION} exists with different integrity"
                exit 1
              fi

              echo "patchpage@${EXPECTED_VERSION} already published with matching integrity, skipping"
              exit 0
              ;;
            404)
              echo "patchpage@${EXPECTED_VERSION} is absent from npm; publishing"
              ;;
            *)
              echo "::error::Unexpected npm registry HTTP status: $http_status"
              exit 1
              ;;
          esac

          node "$npm_cli" publish "$tarball" --ignore-scripts --provenance \
            --registry=https://registry.npmjs.org

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | sed -e '1{/^$/d;}' > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::No changelog notes found for ${version}"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists, skipping"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"

  docker-ghcr:
    needs: [guard, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Build, verify, and push image
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          REVISION: ${{ needs.guard.outputs.revision }}
        run: |
          set -euo pipefail

          image="patchpage-server:release"
          ghcr_image="ghcr.io/allisonmahmood/patchpage-server"
          targets=(
            "${ghcr_image}:${VERSION}"
            "${ghcr_image}:${REVISION}"
            "${ghcr_image}:latest"
          )
          immutable_targets=(
            "${ghcr_image}:${VERSION}"
            "${ghcr_image}:${REVISION}"
          )

          ensure_immutable_tag_absent() {
            local target="$1"
            local manifest_error="${RUNNER_TEMP}/ghcr-manifest-${target##*:}.err"

            if docker manifest inspect "$target" >/dev/null 2>"$manifest_error"; then
              echo "::error::Immutable GHCR tag already exists: ${target}"
              exit 1
            fi

            if grep -Eiq "manifest unknown|no such manifest|not found|name unknown" "$manifest_error"; then
              return
            fi

            echo "::error::Could not verify GHCR tag state for ${target}"
            cat "$manifest_error" >&2
            exit 1
          }

          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            -f apps/server/Dockerfile \
            -t "$image" .

          built_image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          scripts/verify-server-image.sh "$image" "$VERSION" "$REVISION"

          verified_image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if [[ "$verified_image_id" != "$built_image_id" ]]; then
            echo "::error::Verified image changed before tagging"
            exit 1
          fi

          for target in "${targets[@]}"; do
            docker tag "$image" "$target"
          done

          for target in "${targets[@]}"; do
            target_image_id="$(docker image inspect --format '{{.Id}}' "$target")"
            if [[ "$target_image_id" != "$built_image_id" ]]; then
              echo "::error::${target} does not reference the verified image"
              exit 1
            fi
          done

          for target in "${immutable_targets[@]}"; do
            ensure_immutable_tag_absent "$target"
          done

          pushed_digest=""
          for target in "${targets[@]}"; do
            if ! push_output="$(docker push "$target" 2>&1)"; then
              printf '%s\n' "$push_output" >&2
              exit 1
            fi
            printf '%s\n' "$push_output"

            digest="$(
              sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$push_output" | tail -n1
            )"
            if [[ -z "$digest" ]]; then
              echo "::error::Could not determine pushed digest for ${target}"
              exit 1
            fi

            if [[ -z "$pushed_digest" ]]; then
              pushed_digest="$digest"
            elif [[ "$digest" != "$pushed_digest" ]]; then
              echo "::error::${target} pushed digest ${digest} differs from ${pushed_digest}"
              exit 1
            fi
          done

  ghcr-anonymous-smoke:
    needs: [guard, docker-ghcr]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Anonymously pull and boot the published server image
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/allisonmahmood/patchpage-server:${{ needs.guard.outputs.version }}"
          container="patchpage-server-anonymous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_config="$(mktemp -d)"
          export DOCKER_CONFIG="$docker_config"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$docker_config"
          }
          trap cleanup EXIT

          pulled=""
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              pulled="true"
              break
            fi

            if [[ "$attempt" != "5" ]]; then
              sleep 15
            fi
          done

          if [[ "$pulled" != "true" ]]; then
            echo "::error::Published image was not anonymously pullable"
            exit 1
          fi

          docker run -d --name "$container" -p 127.0.0.1::3000 "$image"
          host_port="$(
            docker container inspect \
              --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' \
              "$container"
          )"
          if [[ -z "$host_port" ]]; then
            echo "::error::Docker did not publish the server port"
            exit 1
          fi

          for _ in {1..60}; do
            body="$(curl -fsS "http://127.0.0.1:${host_port}/healthz" 2>/dev/null || true)"
            if [[ "$body" == '{"ok":true}' ]]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container" || true
          echo "::error::Published image did not return the expected /healthz response"
          exit 1

  npx-smoke:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Smoke test published npm package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"

          for attempt in 1 2 3 4 5; do
            if output="$(npx -y "patchpage@${version}" --version 2>npx-smoke.err)"; then
              if [[ "$output" == "$version" ]]; then
                exit 0
              fi

              echo "Attempt ${attempt}: expected ${version}, got ${output}"
            else
              echo "Attempt ${attempt}: npx failed"
              cat npx-smoke.err || true
            fi

            if [[ "$attempt" != "5" ]]; then
              sleep 30
            fi
          done

          echo "::error::npx patchpage@${version} did not print the expected version"
          exit 1
