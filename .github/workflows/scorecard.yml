name: Scorecard

# OpenSSF Scorecard runs automated supply-chain checks (pinned actions, token
# permissions, dangerous workflow patterns, release provenance, branch
# protection) and writes the findings to the Security tab as code scanning
# alerts.
#
# `publish_results: true` also sends the score to the OpenSSF public dataset,
# which is what makes the badge and the public API entry work. This repository
# is already public, and the published payload is the check results rather
# than repository contents -- but set it to false if you would rather keep the
# score private, at the cost of the badge.

on:
  # Re-scores when branch protection changes, since that drives several checks.
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]

# The upstream template uses `read-all` here, but this repository's
# privileged workflows start from nothing and grant per job. The analysis job
# below declares everything it needs, and job-level permissions replace the
# top-level set rather than adding to it.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the Security tab.
      security-events: write
      # Needed by publish_results for the OIDC token that proves provenance.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
